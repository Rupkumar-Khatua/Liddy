    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
              display: ['Outfit', 'Plus Jakarta Sans', 'system-ui', 'sans-serif'],
              mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
            },
            colors: {
              background: '#F5F5F7',
              surface: '#FFFFFF',
              primary: '#1D1D1F',
              secondary: '#6B7280',
              accent: '#4F46E5',
              'accent-hover': '#4338CA',
            },
            boxShadow: {
              'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
              'glow': '0 0 40px -10px rgba(79, 70, 229, 0.28)',
              'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.07)',
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'enter': 'enter 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              enter: {
                '0%': { opacity: '0', transform: 'translateY(8px) scale(0.99)' },
                '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
              }
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body { 
        font-family: 'Plus Jakarta Sans', sans-serif; 
        background-color: #F6F6F4;
        color: #111114;
        -webkit-font-smoothing: antialiased;
      }

      h1, h2, h3, .font-display {
        font-family: 'Outfit', 'Plus Jakarta Sans', sans-serif;
        text-wrap: balance;
      }

      .dark {
        color-scheme: dark;
      }

      .dark body {
        background-color: #09090B;
        color: #F4F4F5;
      }

      /* Optical compensation for dark mode legibility */
      .dark .text-neutral-400 {
        color: #A1A1AA;
      }
      .dark .text-neutral-500 {
        color: #D4D4D8;
      }
      
      .glass {
        background: rgba(255, 255, 255, 0.78);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(17, 17, 20, 0.08);
      }

      .dark .glass {
        background: rgba(20, 20, 24, 0.86);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      
      .glass-card {
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(17, 17, 20, 0.08);
        box-shadow: 0 2px 14px -2px rgba(0, 0, 0, 0.04);
      }

      .dark .glass-card {
        background: rgba(20, 20, 24, 0.92);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.45);
      }

      .dark .bg-neutral-850,
      .dark [class*="neutral-850"] {
        background-color: #141418 !important;
      }
      .dark .border-neutral-750,
      .dark [class*="neutral-750"] {
        border-color: rgba(255, 255, 255, 0.12) !important;
      }

      .hover-border-glow,
      .glass-card,
      .modal-inner-card,
      .user-profile-card,
      .market-stock-card,
      .nav-item-btn {
        transition: border-color 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s cubic-bezier(0.16, 1, 0.3, 1), transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .hover-border-glow:hover,
      .glass-card:hover,
      .modal-inner-card:hover,
      .user-profile-card:hover,
      .market-stock-card:hover {
        border-color: rgba(56, 189, 248, 0.55) !important;
        box-shadow: 0 8px 24px -6px rgba(56, 189, 248, 0.18) !important;
      }

      .dark .dark-card,
      .dark .modal-card,
      .dark .user-profile-card,
      .dark .modal-inner-card {
        background-color: #141418 !important;
        border-color: rgba(255, 255, 255, 0.1) !important;
        color: #F4F4F5 !important;
      }

      .dark .user-profile-card p,
      .dark .modal-inner-card p {
        color: #E4E4E7;
      }

      .dark .user-profile-footer {
        background-color: #101014 !important;
        border-top-color: rgba(255, 255, 255, 0.08) !important;
      }

      /* Stealth Google Translate Styles */
      .goog-te-banner-frame.skiptranslate,
      .goog-te-banner-frame,
      #goog-gt-tt,
      .goog-te-balloon-frame,
      .goog-tooltip,
      .goog-tooltip:hover,
      .goog-te-spinner-pos,
      #google_translate_element,
      iframe.skiptranslate,
      .skiptranslate,
      div[class*="VIpgJd"],
      iframe[class*="VIpgJd"],
      div[id*="goog-gt-"],
      .goog-te-gadget,
      .goog-te-combo {
        display: none !important;
        visibility: hidden !important;
        height: 0 !important;
        width: 0 !important;
        opacity: 0 !important;
        pointer-events: none !important;
        position: absolute !important;
        left: -9999px !important;
        top: -9999px !important;
        z-index: -9999 !important;
      }
      html, body {
        top: 0px !important;
        position: static !important;
      }
      font,
      font[color],
      .goog-text-highlight {
        background: transparent !important;
        background-color: transparent !important;
        box-shadow: none !important;
        border: none !important;
        color: inherit !important;
      }

      .high-contrast {
        filter: contrast(115%);
      }
      @keyframes feature-marquee {
        0% {
          transform: translate3d(0, 0, 0);
        }
        100% {
          transform: translate3d(-50%, 0, 0);
        }
      }
      .feature-marquee-track {
        display: flex;
        width: max-content;
        animation: feature-marquee 42s linear infinite;
        will-change: transform;
      }
      .feature-marquee-shell:hover .feature-marquee-track,
      .feature-marquee-shell:focus-within .feature-marquee-track {
        animation-play-state: paused;
      }
      @media (prefers-reduced-motion: reduce) {
        .feature-marquee-shell {
          overflow-x: auto;
        }
        .feature-marquee-track {
          animation: none !important;
          transform: none !important;
        }
      }
      .reduced-motion .feature-marquee-shell {
        overflow-x: auto;
      }
      .reduced-motion .feature-marquee-track {
        animation: none !important;
        transform: none !important;
      }
      .reduced-motion *,
      .reduced-motion *::before,
      .reduced-motion *::after {
        animation-duration: 0.001s !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001s !important;
        scroll-behavior: auto !important;
      }

      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #D1D1D6;
        border-radius: 4px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #3F3F46;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      @property --gemini-angle {
        syntax: '<angle>';
        initial-value: 0deg;
        inherits: false;
      }
      @keyframes gemini-glow-spin {
        from {
          --gemini-angle: 0deg;
        }
        to {
          --gemini-angle: 360deg;
        }
      }
      .gemini-yearly-card {
        position: relative;
        padding: 2px;
        border-radius: 1.25rem;
        background: conic-gradient(
          from var(--gemini-angle),
          #4285F4 0%,
          #9B72CB 25%,
          #D96570 50%,
          #34A853 75%,
          #4285F4 100%
        );
        animation: gemini-glow-spin 5.5s linear infinite;
        box-shadow: 0 12px 34px -10px rgba(66, 133, 244, 0.35), 0 0 22px -6px rgba(155, 114, 203, 0.28);
      }
      @media (prefers-reduced-motion: reduce) {
        .gemini-yearly-card {
          animation: none !important;
        }
      }
      .reduced-motion .gemini-yearly-card,
      .gemini-yearly-card-reduced {
        position: relative;
        padding: 2px;
        border-radius: 1.25rem;
        background: linear-gradient(135deg, #4285F4 0%, #9B72CB 35%, #D96570 70%, #34A853 100%);
        animation: none !important;
        box-shadow: 0 10px 28px -10px rgba(66, 133, 244, 0.28);
      }
    </style>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'en',
            includedLanguages: 'en,hi,bn,mr,te,ta,gu,ur,kn,or,ml,pa,as,zh-CN,es,fr,ar,fa,de,ja,ru,it,pt',
            autoDisplay: false
          }, 'google_translate_element');
        }
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async defer></script>
  </head>

    <div id="google_translate_element" style="display:none;position:absolute;left:-9999px;"></div>

    <script type="module" src="/index.tsx"></script>
  </body>
</html>
